<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCLEPIO SAVE SCREEN</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            color: #000;
            margin: 20px;
        }
        h1 {
            font-size: 2em;
        }
        label, select, button {
            font-size: 1.2em;
            margin: 10px;
        }
        button {
            background-color: black;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #444;
        }
        video {
            width: 80%;
            margin-top: 20px;
            border-radius: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <h1>ASCLEPIO SAVE</h1>
    <label>
        <input type="checkbox" id="audioCheck"> Grabar audio
    </label>
    <select id="audioSource" disabled>
        <option value="none">Sin audio</option>
        <option value="microphone">Micrófono</option>
        <option value="system">Sonido del sistema</option>
    </select>
    <br><br>
    <button id="start">Iniciar Grabación</button>
    <button id="stop" disabled>Detener Grabación</button>
    <br><br>
    <video id="video" controls></video>

    <script>
        let mediaRecorder;
        let recordedChunks = [];

        document.getElementById("audioCheck").addEventListener("change", function() {
            document.getElementById("audioSource").disabled = !this.checked;
        });

        document.getElementById("start").addEventListener("click", async () => {
            try {
                let options = { video: true, audio: false };
                const audioOption = document.getElementById("audioSource").value;
                if (document.getElementById("audioCheck").checked) {
                    options.audio = true;
                }
                
                const stream = await navigator.mediaDevices.getDisplayMedia(options);
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    document.getElementById("video").src = url;
                    
                    const now = new Date();
                    const timestamp = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}_${now.getHours()}-${now.getMinutes()}-${now.getSeconds()}`;
                    const filename = `SAVEASCLEPIO_${timestamp}.webm`;
                    
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };
                
                mediaRecorder.start();
                document.getElementById("start").disabled = true;
                document.getElementById("stop").disabled = false;
            } catch (err) {
                console.error("Error al iniciar la grabación: ", err);
            }
        });

        document.getElementById("stop").addEventListener("click", () => {
            mediaRecorder.stop();
            document.getElementById("start").disabled = false;
            document.getElementById("stop").disabled = true;
        });
    </script>
</body>
</html>
